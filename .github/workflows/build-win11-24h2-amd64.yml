name: build-win11-24h2-amd64
on: workflow_dispatch
permissions:
  contents: write
  actions: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  build-win11-24h2-amd64:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Step-1 Build ISO from UUP dump package
        working-directory: ./win11-24h2-amd64
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PSModulePath = "C:\Windows\system32\WindowsPowerShell\v1.0\Modules;$env:PSModulePath"
          Remove-Item -Path "../Drivers/ALL/w10" -Recurse -Force

          & cmd /c .\uup_download_windows.cmd 2>&1 | Tee-Object -FilePath "./build-win11-25h2-amd64.log" -Encoding utf8

      - name: Step-2 Split Archive
        working-directory: .
        shell: pwsh
        run: |
          $SourceDir    = "win11-24h2-amd64"
          $DistDir      = "dist_win11"
          $RevisionName = "win11-24h2-amd64"
          $MaxVolMB     = 1895
          $Reserve      = 16
          $MaxDiffMB    = 128

          New-Item -Path $DistDir -ItemType Directory -Force | Out-Null
          $Iso = Get-ChildItem -Path $SourceDir -Filter "*.iso" -File | Select-Object -First 1

          $BaseName  = $Iso.BaseName
          $IsoLength = $Iso.Length
          $IsoDir    = $Iso.DirectoryName
          $IsoFull   = $Iso.FullName

          $FullHash = (Get-FileHash -Path $IsoFull -Algorithm SHA256).Hash.ToLower()
          $ShortHash = $FullHash.Substring($FullHash.Length - 8)
          $NewFileName = "${BaseName}_${ShortHash}.iso"
          $NewFilePath = Join-Path -Path $IsoDir -ChildPath $NewFileName
          Rename-Item -Path $IsoFull -NewName $NewFileName -Force

          $Revision    = $BaseName.Split('-')[0]
          $SizeInMB    = $IsoLength / 1MB
          $SizeInGB    = $IsoLength / 1GB

          $TotalMB = [Math]::Ceiling($SizeInMB)
          $N       = [Math]::Ceiling($TotalMB / ($MaxVolMB - $Reserve))
          $S       = [Math]::Ceiling($TotalMB / $N) + $Reserve
          $Last    = $TotalMB - $S * ($N - 1)
          $Diff    = $S - $Last

          $VolumeSizeArg = "${S}M"

          $EnvVars = @(
            "ISO_SIZEMB={0:N2} MB" -f $SizeInMB
            "ISO_SIZEGB={0:N2} GB" -f $SizeInGB
            "VOLUME_SIZE=$VolumeSizeArg"
            "VOLUME_COUNT=$N"
            "VOLUME_LAST=${Last}M"
            "VOLUME_DIFF=$Diff"
            "ISO_NAME=$NewFileName"
            "ISO_PATH=$NewFilePath"
            "ISO_REVISION=$Revision"
            "REVISION_NAME=$RevisionName"
            "SHA256=$FullHash"
          )
          $EnvVars | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  ISO Processing Information" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          @(
            "文件名: $NewFileName"
            "大小 : {0:N2} MB" -f $SizeInMB
            "大小 : {0:N2} GB" -f $SizeInGB
            "路径 : $NewFilePath"
            "版本 : $Revision"
            "SHA256: $FullHash"
            "分卷参数: -v$VolumeSizeArg"
            "分卷数: $N"
            "最后一卷: ${Last} MB"
            "差值: $Diff MB"
          ) | ForEach-Object { Write-Host "  $_" }
          Write-Host "========================================" -ForegroundColor Cyan

          $OutputZipFileName = "${RevisionName}-${Revision}.7z"
          $OutputZipPath = Join-Path -Path $DistDir -ChildPath $OutputZipFileName
          Write-Host "VolumeSizeArg : 7z a -t7z -v$VolumeSizeArg -mx=0 $OutputZipPath $NewFilePath"

          & 7z a -t7z -v"$VolumeSizeArg" -mx=0 "$OutputZipPath" "$NewFilePath"

          Write-Host "Generated archive: $OutputZipPath"
          Write-Host "Split Archive Done..." -ForegroundColor Green

          $vols = Get-ChildItem "./dist_win11/*.7z.*"
          $max = ($vols | Measure-Object Length -Maximum).Maximum / 1MB
          $min = ($vols | Measure-Object Length -Minimum).Minimum / 1MB
          Write-Host ("最大卷: {0:N2} MB" -f $max)
          Write-Host ("最小卷: {0:N2} MB" -f $min)
          Write-Host ("差值  : {0:N2} MB" -f ($max - $min))

          $repo = $env:GITHUB_REPOSITORY
          $tag  = $RevisionName
          $baseUrl = "https://v4.gh-proxy.org/https://github.com/$repo/releases/download/$tag"
          $parts = @(
            Get-ChildItem -Path $DistDir -File |
              Where-Object { $_.Name -match '\.7z\.\d+$' } |
              Sort-Object { [int]($_.Name -replace '^.*\.7z\.', '') }
          )
          if ($parts.Count -eq 0) {
            throw "No 7z volume files found in $DistDir"
          }
          $firstPart = $parts[0].Name
          $lastPart  = $parts[-1].Name
          $partCount = $parts.Count
          $tableRows = ($parts | ForEach-Object {
            $name = $_.Name
            $urlName = [uri]::EscapeDataString($name)
            $idx = [int]($name -replace '^.*\.7z\.', '')
            $ext = [regex]::Match($name, '\.7z\.\d+$').Value
            "| $idx | ``$name`` | [下载$ext]($baseUrl/$urlName) |"
          }) -join "`n"
          $downloadLinks = @(
            "| 分卷 | 文件名 | 链接 |"
            "| --- | --- | --- |"
            $tableRows
          ) -join "`n"
          @(
            "FIRST_PART=$firstPart"
            "LAST_PART=$lastPart"
            "PART_COUNT=$partCount"
            "DOWNLOAD_BASE_URL=$baseUrl"
            "DOWNLOAD_LINKS<<EOF"
            $downloadLinks
            "EOF"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Dynamic Download Links" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Base URL      : $baseUrl"
          Write-Host "First Part    : $firstPart"
          Write-Host "Last Part     : $lastPart"
          Write-Host "Part Count    : $partCount"
          Write-Host "Download Links:"
          Write-Host $downloadLinks
          Write-Host "========================================" -ForegroundColor Cyan

      - name: Step-3 Delete Old Release
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release delete "${{ env.REVISION_NAME }}" --cleanup-tag -y || true

      - name: Step-4 Delete past completed runs of this workflow
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | while read -r run_id; do
              if [ -z "$run_id" ]; then continue; fi
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            done

      - name: Step-5 Build New Release
        uses: softprops/action-gh-release@v3
        with:
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            ## Windows 11 25H2 amd64 ${{ env.ISO_REVISION }}
            - **ARTIFACT**: ${{ env.ISO_NAME }}
            - **Version**: ${{ env.ISO_REVISION }}_Pro
            - **SHA256**: ${{ env.SHA256 }}
            - **Language**: zh_CN
            - **File Size**: ${{ env.ISO_SIZEMB }} 、 ${{ env.ISO_SIZEGB }}
            - **Volume Size**: ${{ env.VOLUME_SIZE }}
            - **Volume Count**: ${{ env.PART_COUNT }}
            ---
            ### 📦 下载说明
            使用 7-Zip 进行分卷压缩，每卷 ${{ env.VOLUME_SIZE }}，共 ${{ env.PART_COUNT }} 卷。

            **分卷下载链接**：

            ${{ env.DOWNLOAD_LINKS }}

            **下载方式**:
            1. 下载以上所有 `.7z.001`, `.7z.002`,`.7z.003` ... 等后缀的文件。
            2. 确保所有文件位于同一文件夹。
            3. 使用 7-Zip 解压 `${{ env.FIRST_PART }}` 即可获得完整的 ISO 文件。
            4. 使用 `https://gh-proxy.com/` 加速下载
            ---
            > ⚠️ **Note**: This is a multi-volume archive (.7z.001, .7z.002...). Please download all parts before extracting.
          tag_name: ${{ env.REVISION_NAME }}
          name: ${{ env.REVISION_NAME }}-${{ env.ISO_REVISION }}
          files: |
            ./dist_win11/*.7z.*
            ./win11-24h2-amd64/*.log
